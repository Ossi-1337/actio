name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force_all:
        description: Run every validation job
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  pull-requests: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      cli_src: ${{ steps.filter.outputs.cli_src }}
      cli_tests: ${{ steps.filter.outputs.cli_tests }}
      core_src: ${{ steps.filter.outputs.core_src }}
      core_tests: ${{ steps.filter.outputs.core_tests }}
      engine_src: ${{ steps.filter.outputs.engine_src }}
      engine_tests: ${{ steps.filter.outputs.engine_tests }}
      git_src: ${{ steps.filter.outputs.git_src }}
      git_tests: ${{ steps.filter.outputs.git_tests }}
      runner_docker_src: ${{ steps.filter.outputs.runner_docker_src }}
      runner_docker_tests: ${{ steps.filter.outputs.runner_docker_tests }}
      storage_src: ${{ steps.filter.outputs.storage_src }}
      storage_tests: ${{ steps.filter.outputs.storage_tests }}
      web_src: ${{ steps.filter.outputs.web_src }}
      web_tests: ${{ steps.filter.outputs.web_tests }}
      shared: ${{ steps.filter.outputs.shared }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Detect changed areas
        id: filter
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706
        with:
          token: ''
          base: ${{ github.event.diff_base }}
          filters: |
            cli_src:
              - 'src/Actio.Cli/**'
            cli_tests:
              - 'tests/Actio.Cli.Tests/**'
            core_src:
              - 'src/Actio.Core/**'
            core_tests:
              - 'tests/Actio.Core.Tests/**'
            engine_src:
              - 'src/Actio.Engine/**'
            engine_tests:
              - 'tests/Actio.Engine.Tests/**'
            git_src:
              - 'src/Actio.Git/**'
            git_tests:
              - 'tests/Actio.Git.Tests/**'
            runner_docker_src:
              - 'src/Actio.Runner.Docker/**'
            runner_docker_tests:
              - 'tests/Actio.Runner.Docker.Tests/**'
            storage_src:
              - 'src/Actio.Storage/**'
            storage_tests:
              - 'tests/Actio.Storage.Tests/**'
            web_src:
              - 'src/Actio.Web/**'
            web_tests:
              - 'tests/Actio.Web.Tests/**'
            shared:
              - '.workflows/**'
              - 'docs/**'
              - 'Actio.slnx'
              - 'README.md'
              - 'SECURITY.md'
              - '*.props'
              - '*.targets'
              - '*.config'
              - '.editorconfig'
              - '.gitattributes'
              - 'Directory.Build.*'
              - 'Directory.Packages.props'
              - 'global.json'
              - 'NuGet.config'

  format:
    name: Format
    needs: changes
    if: >-
      ${{
        inputs.force_all == 'true' ||
        github.event.new_ref == 'true' ||
        needs.changes.outputs.shared == 'true' ||
        needs.changes.outputs.cli_src == 'true' ||
        needs.changes.outputs.cli_tests == 'true' ||
        needs.changes.outputs.core_src == 'true' ||
        needs.changes.outputs.core_tests == 'true' ||
        needs.changes.outputs.engine_src == 'true' ||
        needs.changes.outputs.engine_tests == 'true' ||
        needs.changes.outputs.git_src == 'true' ||
        needs.changes.outputs.git_tests == 'true' ||
        needs.changes.outputs.runner_docker_src == 'true' ||
        needs.changes.outputs.runner_docker_tests == 'true' ||
        needs.changes.outputs.storage_src == 'true' ||
        needs.changes.outputs.storage_tests == 'true' ||
        needs.changes.outputs.web_src == 'true' ||
        needs.changes.outputs.web_tests == 'true'
      }}
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/dotnet/sdk:10.0
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Verify formatting
        run: |
          mkdir -p /tmp/actio-format
          tar --exclude='./.git' --exclude='*/bin' --exclude='*/obj' -cf - . |
            tar -xf - -C /tmp/actio-format
          cd /tmp/actio-format
          dotnet restore Actio.slnx
          dotnet format Actio.slnx --verify-no-changes --no-restore

  test_core:
    name: Test Core
    needs: changes
    if: >-
      ${{
        inputs.force_all == 'true' ||
        github.event.new_ref == 'true' ||
        needs.changes.outputs.shared == 'true' ||
        needs.changes.outputs.core_src == 'true' ||
        needs.changes.outputs.core_tests == 'true'
      }}
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/dotnet/sdk:10.0
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Run Core tests
        run: dotnet test tests/Actio.Core.Tests/Actio.Core.Tests.csproj --configuration Release --artifacts-path /tmp/actio-artifacts

  test_engine:
    name: Test Engine
    needs: changes
    if: >-
      ${{
        inputs.force_all == 'true' ||
        github.event.new_ref == 'true' ||
        needs.changes.outputs.shared == 'true' ||
        needs.changes.outputs.core_src == 'true' ||
        needs.changes.outputs.engine_src == 'true' ||
        needs.changes.outputs.engine_tests == 'true'
      }}
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/dotnet/sdk:10.0
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Run Engine tests
        run: dotnet test tests/Actio.Engine.Tests/Actio.Engine.Tests.csproj --configuration Release --artifacts-path /tmp/actio-artifacts

  test_runner_docker:
    name: Test Docker Runner
    needs: changes
    if: >-
      ${{
        inputs.force_all == 'true' ||
        github.event.new_ref == 'true' ||
        needs.changes.outputs.shared == 'true' ||
        needs.changes.outputs.core_src == 'true' ||
        needs.changes.outputs.engine_src == 'true' ||
        needs.changes.outputs.runner_docker_src == 'true' ||
        needs.changes.outputs.runner_docker_tests == 'true'
      }}
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/dotnet/sdk:10.0
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Run Docker Runner tests
        run: dotnet test tests/Actio.Runner.Docker.Tests/Actio.Runner.Docker.Tests.csproj --configuration Release --artifacts-path /tmp/actio-artifacts

  test_git:
    name: Test Git
    needs: changes
    if: >-
      ${{
        inputs.force_all == 'true' ||
        github.event.new_ref == 'true' ||
        needs.changes.outputs.shared == 'true' ||
        needs.changes.outputs.git_src == 'true' ||
        needs.changes.outputs.git_tests == 'true'
      }}
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/dotnet/sdk:10.0
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Run Git tests
        run: dotnet test tests/Actio.Git.Tests/Actio.Git.Tests.csproj --configuration Release --artifacts-path /tmp/actio-artifacts

  test_storage:
    name: Test Storage
    needs: changes
    if: >-
      ${{
        inputs.force_all == 'true' ||
        github.event.new_ref == 'true' ||
        needs.changes.outputs.shared == 'true' ||
        needs.changes.outputs.core_src == 'true' ||
        needs.changes.outputs.engine_src == 'true' ||
        needs.changes.outputs.storage_src == 'true' ||
        needs.changes.outputs.storage_tests == 'true'
      }}
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/dotnet/sdk:10.0
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Run Storage tests
        run: dotnet test tests/Actio.Storage.Tests/Actio.Storage.Tests.csproj --configuration Release --artifacts-path /tmp/actio-artifacts

  test_web:
    name: Test Web
    needs: changes
    if: >-
      ${{
        inputs.force_all == 'true' ||
        github.event.new_ref == 'true' ||
        needs.changes.outputs.shared == 'true' ||
        needs.changes.outputs.core_src == 'true' ||
        needs.changes.outputs.engine_src == 'true' ||
        needs.changes.outputs.storage_src == 'true' ||
        needs.changes.outputs.web_src == 'true' ||
        needs.changes.outputs.web_tests == 'true'
      }}
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/dotnet/sdk:10.0
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Run Web tests
        run: dotnet test tests/Actio.Web.Tests/Actio.Web.Tests.csproj --configuration Release --artifacts-path /tmp/actio-artifacts

  check_web_assets:
    name: Check Web assets
    needs: changes
    if: >-
      ${{
        inputs.force_all == 'true' ||
        github.event.new_ref == 'true' ||
        needs.changes.outputs.shared == 'true' ||
        needs.changes.outputs.web_src == 'true' ||
        needs.changes.outputs.web_tests == 'true'
      }}
    runs-on: ubuntu-latest
    container:
      image: node:24
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Check browser JavaScript syntax
        run: node --check src/Actio.Web/wwwroot/app.js

  test_cli:
    name: Test CLI
    needs: changes
    if: >-
      ${{
        inputs.force_all == 'true' ||
        github.event.new_ref == 'true' ||
        needs.changes.outputs.shared == 'true' ||
        needs.changes.outputs.cli_src == 'true' ||
        needs.changes.outputs.cli_tests == 'true' ||
        needs.changes.outputs.core_src == 'true' ||
        needs.changes.outputs.engine_src == 'true' ||
        needs.changes.outputs.git_src == 'true' ||
        needs.changes.outputs.git_tests == 'true' ||
        needs.changes.outputs.runner_docker_src == 'true' ||
        needs.changes.outputs.storage_src == 'true' ||
        needs.changes.outputs.web_src == 'true'
      }}
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/dotnet/sdk:10.0
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Run CLI tests
        run: dotnet test tests/Actio.Cli.Tests/Actio.Cli.Tests.csproj --configuration Release --artifacts-path /tmp/actio-artifacts
